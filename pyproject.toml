# Unlike the previous generation's, this file declares dependencies as well as pytest config.
# That tree carried a pyproject.toml holding nothing but `[tool.pytest.ini_options]` and an
# effectively empty uv.lock, so what the app actually needed lived in a requirements.txt that
# nothing verified. Everything here is pinned to a version this tree has been run against.
[project]
name = "uavaero"
version = "0.1.0"
description = "Aero-first UAV design: OpenVSP/VSPAERO geometry and aerodynamics, multiple drag models, flight dynamics, and design-space optimisation."
requires-python = ">=3.13"
dependencies = [
    "numpy==2.5.1",
    "scipy==1.18.0",
    "matplotlib==3.10.3",
    "PySide6==6.9.1",
    "pyvista==0.48.4",
    "pyvistaqt==0.12.0",
    "neuralfoil==0.3.2",
    "aerosandbox==4.2.10",  # used for its Airfoil/UIUC database and NeuralFoil wrapper only;
                            # its native VLM is deliberately not a solver in this tree
    "build123d==0.11.1",
    "pytest==8.4.0",
    "PyYAML==6.0.3",
]

# NOT pip-installable, resolved through uavaero/paths.py:
#   OpenVSP 3.51.0 - install from its own bundled wheel directory. Absent, every VSPAERO solve
#                    and the OpenVSP reference cases skip; nothing else is affected.
#   XFOIL, AVL     - standalone binaries under external/<tool>/. Both degrade to PATH.
# paths.py falls back to the sibling Software/ tree for external/ and data/, so a machine already
# set up for the previous generation needs no further installation.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: runs a real external solver; minutes, not milliseconds",
]
